<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Регистрация — Облачные заметки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth">
<h1>Облачные заметки</h1>
<form id="reg-form" class="auth-card">
  <h1>Регистрация</h1>
  
  <!-- Поле почты -->
  <input type="email" name="email" class="field" placeholder="почта..." required autocomplete="email">
  
  <!-- Поле пароля -->
  <input type="password" name="pass" class="field" placeholder="пароль..." required autocomplete="new-password">
  
  <!-- Повтор пароля -->
  <input type="password" name="pass2" class="field" placeholder="повторите пароль..." required autocomplete="new-password">
  
  <!-- !!! НОВОЕ ПОЛЕ: РАНДОМНАЯ КАПЧА !!! -->
  <!-- JS сам подставит сюда вопрос "Сколько будет X + Y?" -->
  <input type="text" id="reg-captcha" class="field" placeholder="Сколько будет ...?" required autocomplete="off">
  
  <!-- Сообщение об ошибке/успехе -->
  <p class="err-msg" hidden></p>
  
  <!-- Кнопка -->
  <div class="auth-row">
    <button type="submit" class="btn">регистрация</button>
  </div>
  
  <a href="index.html" class="link">уже есть аккаунт? Войти.</a>
