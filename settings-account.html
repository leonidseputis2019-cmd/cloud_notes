<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аккаунт — Облачные заметки</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth">
    
    <!-- Верхняя панель -->
    <div class="topbar">
        <a href="settings.html" class="iconbtn back-btn" title="Назад">
            <img src="icons/back.png" alt="назад">
        </a>
        <h1 class="topbar-title">Настройки</h1>
    </div>

    <!-- Карточка аккаунта -->
    <div class="acc">
        <h3>Выбор аккаунта</h3>
        
        <!-- Рамка с текущим аккаунтом -->
        <div class="current-session-box">
            <span id="acc-email">...</span>
            <span class="plan-badge" id="acc-plan">Базовый</span>
        </div>

        <!-- 1. Главная кнопка: Добавить -->
        <button id="add-acc" class="btn w-full">Добавить аккаунт</button>

        <!-- Разделитель -->
        <div style="height: 10px;"></div>

        <!-- 2. Второстепенная: Выйти -->
        <button id="logout" class="btn btn-ghost w-full">Выйти из аккаунта</button>

        <!-- 3. Опасная: Удалить -->
        <a href="#" id="del-acc" class="danger-link">Удалить аккаунт навсегда</a>
    </div>

    <!-- Подключаем Supabase НАДЕЖНО -->
    <script src="https://unpkg.com/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    
    <!-- Твой основной скрипт -->
    <script src="app.js"></script>

    <!-- Скрипт-защита: если SB все еще нет, пробуем альтернативный CDN -->
    <script>
        if (typeof SB === 'undefined') {
            console.warn('Supabase JS не загружен с unpkg, пробуем jsdelivr...');
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js';
            script.onload = () => location.reload(); // Перезагружаем страницу после загрузки
            document.head.appendChild(script);
        }
    </script>
</body>
</html>
