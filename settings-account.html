<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аккаунт — Облачные заметки</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- 1. Сначала загружаем Supabase НАДЕЖНО -->
    <script src="https://unpkg.com/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    
    <!-- 2. Если unpkg не сработал, пробуем jsdelivr БЕЗ перезагрузки -->
    <script>
        if (typeof supabase === 'undefined' && typeof SB === 'undefined') {
            document.write('<scr' + 'ipt src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"><\/scr' + 'ipt>');
        }
    </script>
</head>
<body class="auth">
    
    <!-- Верхняя панель -->
    <div class="topbar">
        <a href="settings.html" class="iconbtn back-btn" title="Назад">
            <img src="icons/back.png" alt="назад">
        </a>
        <h1 class="topbar-title">Настройки</h1>
    </div>

    <!-- Карточка аккаунта -->
    <div class="acc">
        <h3>Выбор аккаунта</h3>
        
        <!-- Рамка с текущим аккаунтом -->
        <div class="current-session-box">
            <span id="acc-email">...</span>
            <span class="plan-badge" id="acc-plan">Базовый</span>
        </div>

        <!-- 1. Главная кнопка: Добавить -->
        <button id="add-acc" class="btn w-full">Добавить аккаунт</button>

        <!-- Разделитель -->
        <div style="height: 10px;"></div>

        <!-- 2. Второстепенная: Выйти -->
        <button id="logout" class="btn btn-ghost w-full">Выйти из аккаунта</button>

        <!-- 3. Опасная: Удалить -->
        <a href="#" id="del-acc" class="danger-link">Удалить аккаунт навсегда</a>
    </div>

    <!-- 3. Только ПОСЛЕ загрузки SB запускаем app.js -->
    <script>
        // Ждем, пока SB появится в глобальной области видимости
        function waitForSB(callback) {
            if (typeof supabase !== 'undefined' || typeof SB !== 'undefined') {
                // Нормализуем имя переменной, если нужно
                if (typeof supabase !== 'undefined' && typeof SB === 'undefined') {
                    window.SB = supabase; 
                }
                callback();
            } else {
                setTimeout(() => waitForSB(callback), 100);
            }
        }

        waitForSB(() => {
            const script = document.createElement('script');
            script.src = 'app.js';
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
