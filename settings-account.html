<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аккаунт — Облачные заметки</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth">
    
    <!-- Верхняя панель настроек -->
    <div class="topbar">
        <a href="settings.html" class="iconbtn back-btn" title="Назад">
            <img src="icons/back.png" alt="назад">
        </a>
        <h1 class="topbar-title">Настройки</h1>
    </div>

    <!-- Карточка аккаунта -->
    <div class="acc">
        <h3>Выбор аккаунта</h3>
        
        <!-- Блок с текущим аккаунтом (в рамке) -->
        <div class="current-session-box">
            <span id="acc-email">...</span>
            <span class="plan-badge" id="acc-plan">Базовый</span>
        </div>

        <!-- 1. Главное действие: Добавить аккаунт -->
        <button id="add-acc" class="btn">Добавить аккаунт</button>

        <!-- Разделитель или отступ -->
        <div style="height: 10px;"></div>

        <!-- 2. Второстепенное действие: Выйти -->
        <button id="logout" class="btn btn-ghost">Выйти из аккаунта</button>

        <!-- 3. Опасное действие: Удалить -->
        <a href="#" id="del-acc" class="danger-link">Удалить аккаунт навсегда</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
